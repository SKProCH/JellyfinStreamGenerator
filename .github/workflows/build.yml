name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore JellyfinStreamGenerator.slnx

      - name: Build
        run: dotnet build JellyfinStreamGenerator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JellyfinStreamGenerator.slnx --configuration Release --no-build --verbosity normal
